<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioPanel</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1c2230; --muted:#6b7385; --line:#e3e6ec;
  --accent:#0f766e; --accent-soft:#e6f4f2; --danger:#c2410c; --danger-soft:#fdeee6;
  --ok:#15803d; --ok-soft:#e8f5ec; --warn:#b45309; --warn-soft:#fdf3e2; --side:#111827; --side-text:#cbd5e1;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--panel:#171a21;--text:#e6e8ee;--muted:#9aa3b5;--line:#272c36;
    --accent:#2dd4bf;--accent-soft:#12302d;--danger:#fb923c;--danger-soft:#3a2216;
    --ok:#4ade80;--ok-soft:#14301f;--warn:#fbbf24;--warn-soft:#3a2d10;--side:#0b0d11;--side-text:#aab4c5}
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand-mark svg{width:18px;height:18px}

/* Layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-text);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .brand{color:#fff;padding:4px 8px 18px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--side-text);text-decoration:none;cursor:pointer}
nav a:hover{background:rgba(255,255,255,.06);color:#fff}
nav a.active{background:rgba(45,212,191,.14);color:#fff}
nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.side-foot{margin-top:auto;font-size:12px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:#fff;display:block}
.side-foot button{background:none;border:0;color:var(--side-text);padding:4px 0;cursor:pointer;text-decoration:underline;margin-right:10px}
main{padding:22px 28px;min-width:0}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header.top h1{font-size:21px;margin:0;margin-right:auto}
.scope{display:flex;gap:8px;flex-wrap:wrap}
.menu-btn{display:none}

/* Elementos */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f input,label.f select{color:var(--text);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15px;margin:0;margin-right:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:var(--bg)}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:36px;text-align:center;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.err{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.tile{padding:16px}
.tile .k{color:var(--muted);font-size:12.5px}
.tile .v{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dev-list{padding:6px 0}
.dev-row{display:flex;align-items:center;gap:10px;padding:9px 16px}
.dev-row .grow{flex:1;min-width:0}
.alert{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:14px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{max-width:820px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-h h3{margin:0;font-size:16px;flex:1}
.modal-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.devpick{border:1px solid var(--line);border-radius:8px;max-height:240px;overflow:auto}
.devpick .grp{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.devpick label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.devpick label:last-child{border-bottom:0}
.hint{font-size:12.5px;color:var(--muted)}
.bandeja{border:1px solid var(--line);border-radius:8px;max-height:52vh;overflow:auto}
.bandeja th{position:sticky;top:0;z-index:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px;cursor:pointer;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent);font-weight:600}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:99;max-width:90vw}
#toast.err{background:var(--danger);color:#fff}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:40;width:240px;transform:translateX(-100%);transition:.2s}
  aside.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:16px}
  .two,.grid2{grid-template-columns:1fr}
  th,td{padding:8px 10px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>BioPanel</div>
    <p class="hint" style="margin:6px 0 20px">Control de asistencia y accesos</p>
    <div style="display:flex;flex-direction:column;gap:12px">
      <label class="f">Correo<input name="email" type="email" required autocomplete="username"></label>
      <label class="f">Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" style="padding:10px">Entrar</button>
      <div id="loginErr" class="hint" style="color:var(--danger)"></div>
    </div>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>BioPanel</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <b id="meName"></b><span id="meEmpresa"></span><br>
      <button onclick="cambiarClave()">Cambiar clave</button><button onclick="logout()">Salir</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <button class="btn menu-btn" onclick="side.classList.toggle('open')">☰</button>
      <h1 id="title"></h1>
      <div class="scope">
        <select id="scopeEmpresa" class="hidden" title="Empresa"></select>
        <select id="scopeSucursal" title="Sucursal"></select>
      </div>
    </header>
    <div id="aviso" class="alert hidden" style="background:var(--danger-soft);color:var(--danger)">
      <b>El servidor está funcionando con una versión anterior del programa.</b> Reinícialo antes de editar empleados:
      en la terminal donde corre, pulsa Ctrl+C, ejecuta <code>node server.js</code> y recarga esta página.</div>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toast" class="hidden"></div>

<script>
const ICON = {
  resumen:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  empresas:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/>',
  sucursales:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  dispositivos:'<rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="9" r="3"/><path d="M9 17h6"/>',
  empleados:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-3.5 3.8-5.5 7-5.5s6 2 7 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .6 3.4 2.4 4 5.5"/>',
  marcaciones:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  usuarios:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'
};
const VERIF = {0:'Clave',1:'Huella',2:'Tarjeta',3:'Clave',4:'Tarjeta',15:'Rostro',25:'Palma'};
const ESTADO_ED = {sincronizado:['ok','Sincronizado'],pendiente:['warn','Pendiente'],error:['err','Error'],eliminando:['warn','Quitando']};

let token = localStorage.getItem('bp_token') || '';
let me = null, empresas = [], sucursales = [], current = 'resumen', timer = null;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin = () => me && me.rol === 'admin';
const scope = () => ({ empresa_id: isAdmin() ? $('#scopeEmpresa').value : '', sucursal_id: $('#scopeSucursal').value });
const qs = o => { const p = new URLSearchParams(); for (const k in o) if (o[k] !== '' && o[k] != null) p.set(k, o[k]); const s = p.toString(); return s ? '?' + s : ''; };

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (r.status === 401 && path !== '/login') { logout(); throw new Error('Sesión expirada'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Error ' + r.status);
  return data;
}
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.add('hidden'), 3500);
}
async function run(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); throw e; } }
function hace(ts) {
  if (!ts) return 'nunca';
  const s = Math.round((Date.now() - new Date(ts)) / 1000);
  if (s < 60) return `hace ${s}s`; if (s < 3600) return `hace ${Math.round(s/60)} min`;
  if (s < 86400) return `hace ${Math.round(s/3600)} h`; return new Date(ts).toLocaleString('es-BO');
}
const tipoBadge = t => t === 'acceso' ? '<span class="badge acc">Control de acceso</span>' : '<span class="badge">Biométrico</span>';

/* ---------- Sesión ---------- */
$('#loginForm').onsubmit = async ev => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  try {
    const r = await api('/login', { method: 'POST', body: { email: f.get('email'), password: f.get('password') } });
    token = r.token; localStorage.setItem('bp_token', token); start();
  } catch (e) { $('#loginErr').textContent = e.message; }
};
function logout() { token = ''; localStorage.removeItem('bp_token'); clearInterval(timer); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }

async function start() {
  if (!token) return logout();
  try { me = await api('/me'); } catch { return; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#meName').textContent = me.nombre || me.email;
  $('#meEmpresa').textContent = isAdmin() ? 'Administrador' : me.empresa;
  $('#aviso').classList.toggle('hidden', !me.desactualizado);
  const items = [['resumen','Resumen'], ...(isAdmin() ? [['empresas','Empresas']] : []), ['sucursales','Sucursales'],
    ['dispositivos','Dispositivos'], ['empleados','Empleados'], ['marcaciones','Marcaciones'], ...(isAdmin() ? [['usuarios','Accesos al sistema']] : [])];
  $('#nav').innerHTML = items.map(([k, t]) => `<a data-v="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${t}</a>`).join('');
  $('#nav').onclick = e => { const a = e.target.closest('a'); if (a) go(a.dataset.v); };
  await cargarScope();
  go(localStorage.getItem('bp_view') || 'resumen');
}

async function cargarScope() {
  empresas = await api('/empresas');
  const se = $('#scopeEmpresa');
  if (isAdmin()) {
    se.classList.remove('hidden');
    const prev = localStorage.getItem('bp_emp') || '';
    se.innerHTML = '<option value="">Todas las empresas</option>' + empresas.map(e => `<option value="${e.id}">${esc(e.nombre)}</option>`).join('');
    se.value = empresas.some(e => String(e.id) === prev) ? prev : '';
  }
  await cargarSucursales();
}
async function cargarSucursales() {
  sucursales = await api('/sucursales' + qs({ empresa_id: scope().empresa_id }));
  const ss = $('#scopeSucursal'), prev = localStorage.getItem('bp_suc') || '';
  ss.innerHTML = '<option value="">Todas las sucursales</option>' + sucursales.map(s =>
    `<option value="${s.id}">${esc(isAdmin() && !scope().empresa_id ? s.empresa + ' · ' : '')}${esc(s.nombre)}</option>`).join('');
  ss.value = sucursales.some(s => String(s.id) === prev) ? prev : '';
}
$('#scopeEmpresa').onchange = async () => { localStorage.setItem('bp_emp', $('#scopeEmpresa').value); localStorage.removeItem('bp_suc'); await cargarSucursales(); render(); };
$('#scopeSucursal').onchange = () => { localStorage.setItem('bp_suc', $('#scopeSucursal').value); render(); };

function go(v) {
  if (!VIEWS[v] || (['empresas','usuarios'].includes(v) && !isAdmin())) v = 'resumen';
  current = v; localStorage.setItem('bp_view', v);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.v === v));
  $('#side').classList.remove('open');
  render();
}
async function render() {
  clearInterval(timer);
  const v = VIEWS[current];
  $('#title').textContent = v.title;
  try { await v.render(); } catch (e) { $('#view').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
  if (v.auto) timer = setInterval(() => v.render().catch(() => {}), 10000);
}

/* ---------- Modal ---------- */
function modal({ title, body, onSave, saveText = 'Guardar', wide }) {
  $('#modalRoot').innerHTML = `<div class="modal-bg"><form class="modal ${wide ? 'wide' : ''}">
    <div class="modal-h"><h3>${esc(title)}</h3><button type="button" class="x" data-close>×</button></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f"><button type="button" class="btn" data-close>${onSave ? 'Cancelar' : 'Cerrar'}</button>${onSave ? `<button class="btn primary">${saveText}</button>` : ''}</div>
  </form></div>`;
  const form = $('#modalRoot form');
  $('#modalRoot').querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  form.onsubmit = async ev => {
    ev.preventDefault(); if (!onSave) return;
    const btn = form.querySelector('.btn.primary'); btn.disabled = true;
    try { await onSave(form); closeModal(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  };
  return form;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
const fd = form => Object.fromEntries(new FormData(form));
const confirmar = msg => window.confirm(msg);

function empresaSelect(name, value, required = true) {
  return `<label class="f">Empresa<select name="${name}" ${required ? 'required' : ''}><option value="">Elegir…</option>${empresas.map(e => `<option value="${e.id}" ${String(value) === String(e.id) ? 'selected' : ''}>${esc(e.nombre)}</option>`).join('')}</select></label>`;
}

/* ---------- Vistas ---------- */
const VIEWS = {};

VIEWS.resumen = { title: 'Resumen', auto: true, async render() {
  const s = scope();
  const [r, devs, marc] = await Promise.all([api('/resumen' + qs(s)), api('/dispositivos' + qs(s)), api('/marcaciones' + qs({ ...s, limit: 12 }))]);
  $('#view').innerHTML = `
    ${r.sin_asignar > 0 ? `<div class="alert">Hay ${r.sin_asignar} equipo(s) conectado(s) sin asignar a una sucursal. <a onclick="go('dispositivos')" style="cursor:pointer">Asignar ahora</a></div>` : ''}
    <div class="tiles">
      <div class="card tile"><div class="k">Equipos en línea</div><div class="v">${r.en_linea}<small> / ${r.dispositivos}</small></div></div>
      <div class="card tile"><div class="k">Empleados</div><div class="v">${r.empleados}</div></div>
      <div class="card tile"><div class="k">Marcaciones hoy</div><div class="v">${r.marcaciones_hoy}</div></div>
    </div>
    <div class="two">
      <div class="card"><div class="card-h"><h2>Dispositivos</h2><button class="btn sm" onclick="go('dispositivos')">Ver todos</button></div>
        <div class="dev-list">${devs.filter(d => d.empresa_id).map(d => `<div class="dev-row"><span class="dot ${d.en_linea ? 'on' : ''}"></span>
          <div class="grow"><b>${esc(d.nombre)}</b><div class="sub hint">${esc(d.sucursal || '')} · ${hace(d.ultimo_contacto)}</div></div>${tipoBadge(d.tipo)}</div>`).join('') || '<div class="empty">Sin dispositivos</div>'}</div></div>
      <div class="card"><div class="card-h"><h2>Últimas marcaciones</h2><button class="btn sm" onclick="go('marcaciones')">Ver todas</button></div>
        <div class="table-wrap"><table><tbody>${marc.map(m => `<tr><td><b>${esc(m.empleado || 'PIN ' + m.pin)}</b><div class="sub">${esc(m.dispositivo)}</div></td>
          <td class="num" style="text-align:right">${esc(m.fecha.slice(11,16))}<div class="sub">${esc(m.fecha.slice(0,10))}</div></td></tr>`).join('') || '<tr><td class="empty">Sin marcaciones</td></tr>'}</tbody></table></div></div>
    </div>`;
}};

VIEWS.empresas = { title: 'Empresas', async render() {
  empresas = await api('/empresas');
  $('#view').innerHTML = `<div class="card"><div class="card-h"><h2>${empresas.length} empresas</h2><button class="btn primary" onclick="formEmpresa()">+ Nueva empresa</button></div>
    <div class="table-wrap"><table><thead><tr><th>Empresa</th><th>NIT</th><th class="num">Sucursales</th><th class="num">Dispositivos</th><th class="num">Empleados</th><th></th></tr></thead><tbody>
    ${empresas.map(e => `<tr><td><b>${esc(e.nombre)}</b></td><td>${esc(e.nit)}</td><td class="num">${e.sucursales}</td><td class="num">${e.dispositivos}</td><td class="num">${e.empleados}</td>

/* Bandeja: usuarios que ya existen en el reloj → revisar, descargar Excel y agregar al panel */
const PRIVILEGIO = { 0: 'Usuario', 14: 'Administrador' };
function bandejaReloj(id) {
  const d = devsCache.find(x => x.id === id);
  const desmarcados = new Set();
  let datos = { usuarios: [] }, poll = null;
  const form = modal({ title: `Usuarios en ${d.nombre}`, wide: true, saveText: 'Agregar seleccionados al panel', body: `
    <div class="toolbar" style="margin:0"><span id="bEstado" class="hint grow"></span>
      <button type="button" class="btn" id="bLeer">Leer del reloj</button>
      <button type="button" class="btn" id="bExcel">Descargar Excel</button></div>
    <div id="bTabla"></div>
    <p class="hint" style="margin:0">Los usuarios agregados se crean como empleados ya sincronizados con este equipo (no se les reenvía nada). Luego puedes completar su CI, departamento y cargo en Empleados.</p>`,
    async onSave() {
      const pines = [...form.querySelectorAll('input[name=bpin]:checked')].map(c => c.value);
      if (!pines.length) throw new Error('Selecciona al menos un usuario nuevo');
      const r = await api(`/dispositivos/${id}/usuarios-reloj/agregar`, { method: 'POST', body: { pines } });
      toast(`${r.agregados} empleado(s) agregado(s)${r.omitidos ? ` · ${r.omitidos} ya existían` : ''}`); render();
    } });
  const btnAgregar = form.querySelector('.btn.primary');
  const contar = () => {
    const n = form.querySelectorAll('input[name=bpin]:checked').length;
    btnAgregar.textContent = n ? `Agregar ${n} al panel` : 'Agregar seleccionados al panel';
    btnAgregar.disabled = !n;
  };
  const pintar = () => {
    const l = datos.lectura, list = datos.usuarios, leyendo = l && ['pendiente', 'enviado'].includes(l.estado);
    form.querySelector('#bEstado').textContent =
      !l ? (list.length ? 'Estos son los usuarios que el reloj ha informado. Pulsa "Leer del reloj" para traerlos todos.' : 'Aún no se han leído los usuarios de este equipo.')
      : l.estado === 'pendiente' ? (datos.en_linea ? 'Solicitud en cola: el equipo la recogerá en unos segundos…' : 'El equipo está fuera de línea: se leerá cuando se conecte.')
      : l.estado === 'enviado' ? 'Leyendo usuarios del reloj…'
      : l.estado === 'error' ? `El equipo rechazó la lectura (código ${l.retorno}).`
      : `Última lectura ${hace(l.respondido)} · ${list.length} usuarios en el reloj`;
    form.querySelector('#bExcel').disabled = !list.length;
    const nuevos = list.filter(u => !u.empleado_id);
    form.querySelector('#bTabla').innerHTML = list.length ? `<div class="bandeja"><table>
      <thead><tr><th><input type="checkbox" id="bTodos" title="Seleccionar todos los nuevos" ${nuevos.length ? '' : 'disabled'} ${nuevos.length && nuevos.every(u => !desmarcados.has(u.pin)) ? 'checked' : ''}></th>
        <th class="num">PIN</th><th>Nombre</th><th>Tarjeta</th><th>Privilegio</th><th>Clave</th><th>Biometría</th><th>Estado</th></tr></thead><tbody>
      ${list.map(u => `<tr>
        <td><input type="checkbox" name="bpin" value="${esc(u.pin)}" ${u.empleado_id ? 'disabled' : desmarcados.has(u.pin) ? '' : 'checked'}></td>
        <td class="num"><b>${esc(u.pin)}</b></td>
        <td>${u.nombre ? esc(u.nombre) : '<span class="hint">Sin nombre</span>'}</td>
        <td class="num">${esc(u.tarjeta)}</td>
        <td>${u.privilegio == 14 ? '<span class="badge acc">Administrador</span>' : esc(PRIVILEGIO[u.privilegio] || 'Nivel ' + u.privilegio)}</td>
        <td class="num">${esc(u.password)}</td>
        <td><div class="chips">${u.rostro ? '<span class="badge">Rostro</span>' : ''}${u.huella ? '<span class="badge">Huella</span>' : ''}${u.rostro || u.huella ? '' : '<span class="hint">—</span>'}</div></td>
        <td>${u.empleado_id ? `<span class="badge ok">En el panel</span>${u.empleado !== u.nombre ? `<div class="sub">${esc(u.empleado)}</div>` : ''}` : '<span class="badge warn">Nuevo</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">${leyendo ? 'Esperando datos del reloj…' : 'Sin usuarios'}</div>`;
    contar();
  };
  const cargar = async () => {
    clearTimeout(poll);
    if (!document.body.contains(form)) return; // se cerró la ventana
    datos = await api(`/dispositivos/${id}/usuarios-reloj`);
    pintar();
    const l = datos.lectura; // sigue consultando mientras la lectura esté en curso (y unos segundos después)
    if (l && (['pendiente', 'enviado'].includes(l.estado) || (l.estado === 'ok' && Date.now() - new Date(l.respondido) < 15000)))
      poll = setTimeout(() => cargar().catch(() => {}), 3000);
  };
  const leer = async () => { await run(() => api(`/dispositivos/${id}/leer-usuarios`, { method: 'POST' })); await cargar(); };
  form.querySelector('#bLeer').onclick = () => leer().catch(() => {});
  form.querySelector('#bExcel').onclick = async () => {
    const r = await fetch(`/api/dispositivos/${id}/usuarios-reloj?formato=xlsx`, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) return toast('No se pudo exportar', true);
    const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob());
    a.download = `usuarios_${d.sn}.xlsx`; a.click();
  };
  form.querySelector('#bTabla').onchange = e => {
    const t = e.target;
    if (t.id === 'bTodos') form.querySelectorAll('input[name=bpin]:not(:disabled)').forEach(c => {
      c.checked = t.checked; desmarcados[t.checked ? 'delete' : 'add'](c.value);
    });
    else if (t.name === 'bpin') desmarcados[t.checked ? 'delete' : 'add'](t.value);
    contar();
  };
  // La primera vez que se abre, lee el reloj automáticamente
  cargar().then(() => { if (!datos.lectura) return leer(); }, e => toast(e.message, true)).catch(() => {});
}

      <label class="f">Departamento<input name="departamento" value="${esc(e.departamento)}" list="deptos"></label>
      <label class="f">Cargo<input name="cargo" value="${esc(e.cargo)}"></label>
      <label class="f">Tarjeta RFID (opcional)<input name="tarjeta" value="${esc(e.tarjeta)}" inputmode="numeric"></label>
      <label class="f">Clave numérica en el reloj (opcional)<input name="password" value="${esc(e.password)}" pattern="\\d{0,8}" inputmode="numeric"></label>
      <label class="f">Privilegio en el reloj<select name="privilegio"><option value="0">Usuario normal</option><option value="14" ${e.privilegio == 14 ? 'selected' : ''}>Administrador del equipo</option></select></label>
    </div>
    <datalist id="deptos">${[...new Set(empCache.map(x => x.departamento).filter(Boolean))].map(d => `<option value="${esc(d)}">`).join('')}</datalist>
    <div class="f" style="font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px">Equipos donde se creará el usuario
      <div class="devpick" id="devpick">${pickHtml(e.empresa_id)}</div></div>
    <p class="hint" style="margin:0">El rostro o la huella se registran en el propio equipo (Gestión de usuarios → editar → Rostro). Al quitar un equipo, el usuario se borra de ese equipo.
      Si cambias el PIN, su huella, rostro, tarjeta y clave se copian al PIN nuevo. Para entrar con clave en el reloj se escribe primero el PIN y luego la clave.</p>`,
    async onSave(f) {
      const b = fd(f);
      b.dispositivos = [...f.querySelectorAll('input[name=dev]:checked')].map(x => Number(x.value));
      delete b.dev;
      const cambioPin = id && b.pin !== e.pin && e.dispositivos.some(d => d.estado !== 'eliminando');
      if (cambioPin && !confirmar(`¿Cambiar el PIN de ${e.pin} a ${b.pin}?\n\nEn cada reloj: primero se lee su huella, rostro, tarjeta y clave; luego se copian al PIN ${b.pin} y, solo cuando el reloj confirma todo, se borra el PIN ${e.pin}. Si algo falla no se borra nada y el empleado conserva el PIN ${e.pin}.\n\nSus marcaciones anteriores seguirán a su nombre.`))
        throw new Error('Cambio de PIN cancelado');
      if (id) await api('/empleados/' + id, { method: 'PUT', body: b }); else await api('/empleados', { method: 'POST', body: b });
      toast(cambioPin ? 'Guardado. El PIN se cambiará en los equipos en unos segundos'
        : b.dispositivos.length ? 'Guardado. Se enviará a los equipos en unos segundos' : 'Empleado guardado'); render();
    } });
  const es = form.querySelector('select[name=empresa_id]');
  if (es) es.onchange = () => { form.querySelector('#devpick').innerHTML = pickHtml(es.value); };
}
async function borrarEmpleado(id) {
  const e = empCache.find(x => x.id === id);
  if (!confirmar(`¿Eliminar a ${e.nombre} (PIN ${e.pin})? También se borrará de ${e.dispositivos.length} equipo(s).`)) return;
  await run(() => api('/empleados/' + id, { method: 'DELETE' }), 'Empleado eliminado'); render();
}

VIEWS.marcaciones = { title: 'Marcaciones', async render() {
  if (!$('#mToolbar')) {
    const hoy = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    $('#view').innerHTML = `<div class="toolbar" id="mToolbar">
      <label class="f">Desde<input type="date" id="mDesde" value="${hoy}"></label>
      <label class="f">Hasta<input type="date" id="mHasta" value="${hoy}"></label>
      <label class="f">Equipo<select id="mDev"><option value="">Todos</option></select></label>
      <label class="f grow">Empleado<input id="mBuscar" placeholder="Nombre o PIN"></label>
      <button class="btn" style="align-self:flex-end" onclick="VIEWS.marcaciones.render()">Filtrar</button>
      <button class="btn primary" style="align-self:flex-end" onclick="exportarCSV()">Exportar Excel (CSV)</button></div><div id="mTable"></div>`;
    ['mDesde', 'mHasta', 'mDev'].forEach(i => $('#' + i).onchange = () => VIEWS.marcaciones.render());
    let t; $('#mBuscar').oninput = () => { clearTimeout(t); t = setTimeout(() => VIEWS.marcaciones.render(), 300); };
  }
  const devs = await api('/dispositivos' + qs(scope()));
  const sel = $('#mDev'), prev = sel.value;
  sel.innerHTML = '<option value="">Todos</option>' + devs.filter(d => d.empresa_id).map(d => `<option value="${d.id}">${esc(d.nombre)}</option>`).join('');
  sel.value = prev;
  const list = await api('/marcaciones' + qs(filtrosMarc()));
  $('#mTable').innerHTML = `<div class="card"><div class="card-h"><h2>${list.length}${list.length >= 1000 ? '+' : ''} marcaciones</h2></div><div class="table-wrap"><table>
    <thead><tr><th>Fecha y hora</th><th class="num">PIN</th><th>Empleado</th><th>Departamento</th>${isAdmin() ? '<th>Empresa</th>' : ''}<th>Sucursal / Equipo</th><th>Verificación</th></tr></thead><tbody>
    ${list.map(m => `<tr><td class="num">${esc(m.fecha)}</td><td class="num">${esc(m.pin)}</td><td>${m.empleado ? '<b>' + esc(m.empleado) + '</b>' : '<span class="hint">No registrado</span>'}</td>
      <td>${esc(m.departamento)}</td>${isAdmin() ? `<td>${esc(m.empresa)}</td>` : ''}<td>${esc(m.sucursal)}<div class="sub">${esc(m.dispositivo)} ${m.tipo === 'acceso' ? '· acceso' : ''}</div></td>
      <td>${esc(VERIF[m.verificacion] || m.verificacion || '')}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Sin marcaciones en este rango</td></tr>'}
    </tbody></table></div></div>`;
}};
function filtrosMarc() {
  return { ...scope(), desde: $('#mDesde').value, hasta: $('#mHasta').value, dispositivo_id: $('#mDev').value, buscar: $('#mBuscar').value.trim(), limit: 1000 };
}
async function exportarCSV() {
  const r = await fetch('/api/marcaciones' + qs({ ...filtrosMarc(), limit: 20000, formato: 'csv' }), { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) return toast('No se pudo exportar', true);
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob());
  a.download = `marcaciones_${$('#mDesde').value}_${$('#mHasta').value}.csv`; a.click();
}

VIEWS.usuarios = { title: 'Accesos al sistema', async render() {
  const list = await api('/usuarios-sistema');
  $('#view').innerHTML = `<div class="card"><div class="card-h"><h2>${list.length} accesos</h2><button class="btn primary" onclick="formUsuario()">+ Nuevo acceso</button></div>
    <div class="table-wrap"><table><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Empresa</th><th></th></tr></thead><tbody>
    ${list.map(u => `<tr><td><b>${esc(u.email)}</b></td><td>${esc(u.nombre)}</td><td>${u.rol === 'admin' ? '<span class="badge acc">Administrador</span>' : '<span class="badge">Empresa</span>'}</td><td>${esc(u.empresa || '—')}</td>
      <td><div class="actions"><button class="btn sm" onclick="resetClave(${u.id})">Cambiar clave</button>${u.id !== me.id ? `<button class="btn sm danger" onclick="borrarUsuario(${u.id})">Eliminar</button>` : ''}</div></td></tr>`).join('')}
    </tbody></table></div></div>
    <p class="hint">Un acceso de tipo "Empresa" solo ve las sucursales, equipos, empleados y marcaciones de su empresa.</p>`;
}};
function formUsuario() {
  const form = modal({ title: 'Nuevo acceso', body: `
    <div class="grid2"><label class="f">Correo<input name="email" type="email" required></label><label class="f">Nombre<input name="nombre"></label></div>
    <label class="f">Rol<select name="rol"><option value="empresa">Empresa (solo ve su empresa)</option><option value="admin">Administrador (ve todo)</option></select></label>
    <div id="uEmp">${empresaSelect('empresa_id', scope().empresa_id)}</div>
    <label class="f">Contraseña<input name="password" type="text" minlength="6" required></label>`,
    async onSave(f) { await api('/usuarios-sistema', { method: 'POST', body: fd(f) }); toast('Acceso creado'); render(); } });
  const rol = form.querySelector('[name=rol]'), emp = form.querySelector('[name=empresa_id]');
  rol.onchange = () => { const a = rol.value === 'admin'; form.querySelector('#uEmp').classList.toggle('hidden', a); emp.required = !a; };
}
function resetClave(id) {
  modal({ title: 'Cambiar clave', body: '<label class="f">Nueva contraseña<input name="password" type="text" minlength="6" required></label>',
    async onSave(f) { await api(`/usuarios-sistema/${id}/password`, { method: 'PUT', body: fd(f) }); toast('Clave actualizada'); } });
}
async function borrarUsuario(id) {
  if (!confirmar('¿Eliminar este acceso?')) return;
  await run(() => api('/usuarios-sistema/' + id, { method: 'DELETE' }), 'Acceso eliminado'); render();
}
function cambiarClave() {
  modal({ title: 'Cambiar mi clave', body: `<label class="f">Clave actual<input name="actual" type="password" required></label><label class="f">Nueva clave<input name="nueva" type="password" minlength="6" required></label>`,
    async onSave(f) { await api('/me/password', { method: 'POST', body: fd(f) }); toast('Clave actualizada'); } });
}

start();
</script>
</body>
</html>
